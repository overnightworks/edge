cloudflare:
  zone: hallucinai.de

github:
  org: overnightworks

services:
  songmaker:
    hosts:
      - {name: songmaker, exposure: public, reason: "songmaker is public with its own login", target: "http://localhost:8080", deny_public: [/auth/backchannel-logout]}
      - {name: "@", exposure: public, reason: "songmaker is public with its own login", target: "http://localhost:8080"}
      - {name: www, exposure: public, reason: "the apex's alias", target: "http://localhost:8080"}
  step-ca:
    run:
      enabled: true
      setup: step-ca/init
  agent-service:
    run:
      enabled: true
      setup: agent-service/setup
  keycloak:
    run:
      enabled: true
      setup: keycloak/go-live
    hosts:
      - {name: auth, exposure: public, reason: "Keycloak's pages are public; its login protects them", ready: /realms/hallucinai/.well-known/openid-configuration}
