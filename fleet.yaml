cloudflare:
  zone: hallucinai.de
  redirect:
    hosts: ["@", www]
    target: "https://auth.hallucinai.de/"
    keep:
      - {path: /impressum, target: "https://songmaker.hallucinai.de"}
      - {path: /datenschutz, target: "https://songmaker.hallucinai.de"}

github:
  org: overnightworks

services:
  songmaker:
    hosts:
      - {name: songmaker, exposure: public, reason: "songmaker is public with its own login", target: "http://localhost:8080", deny_public: [/auth/backchannel-logout, /metrics]}
  hopin:
    repo: {default_branch: master}
    run: {enabled: false}
    hosts:
      - {name: hopin, exposure: public, reason: "video calls; every page needs the Keycloak login (hopin#25)", ready: /health, deny_public: [/auth/backchannel-logout]}
  step-ca:
    run:
      enabled: true
      setup: step-ca/init
  legal:
    run:
      enabled: true
  agent-service:
    run:
      enabled: true
      setup: agent-service/setup
  keycloak:
    run:
      enabled: true
      setup: keycloak/go-live
    hosts:
      - {name: auth, exposure: public, reason: "Keycloak's pages are public; its login protects them", ready: /realms/hallucinai/.well-known/openid-configuration}
