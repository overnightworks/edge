# The static configuration of agent-egress (compose.yaml): the SNI-allowlisting TLS passthrough
# gateway between the agent service, LiteLLM and the two hosts they may reach. Two TCP entrypoints,
# each on the gateway's address on its own network: `egress` for the agent service and `litellm`
# for LiteLLM (compose.yaml's x-egress-address and x-litellm-egress-address;
# tests/test_agent_egress.py holds them equal), no UDP. The global and log blocks are copies of traefik.yml's; the api,
# ping and metrics blocks stay absent. The allowed names stand in dynamic/allowed.yml.
global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

entryPoints:
  egress:
    address: "172.31.252.10:443"
  litellm:
    address: "172.31.239.10:443"

providers:
  file:
    directory: /egress/dynamic
    watch: true
