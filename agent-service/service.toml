# The agent service's configuration. Every path is a mount target of the
# `agent-service` service in compose.yaml; tests/test_agent_service_unit.py holds the two equal.

[identity]
issuer = "https://auth.hallucinai.de/realms/hallucinai"
# https, because the service reaches the issuer through the egress gateway (agent-egress), which
# passes TLS through by name; agent-service/egress/dynamic/allowed.yml names this host.
jwks_url = "https://auth.hallucinai.de/realms/hallucinai/protocol/openid-connect/certs"
audience = "agent-service"
subscription_groups = ["/services/agent-service/subscription"]
group_claim = "groups"

[signing]
key_file = "/run/secrets/agent_service_signing_key"

[mcp]
ca_file = "/run/secrets/step_ca_root_certificate"

[server]
host = "0.0.0.0"

[cli]
working_root = "/run/agent-service/cli"

[cli.anthropic]
binary = "/opt/claude/claude"
version = "2.1.302"
models = ["opus", "sonnet", "haiku"]
token_file = "/run/agent-service/login/claude/token"

# The model of every agent that neither its app nor its own entry overrides.
[defaults]
model = "anthropic/opus"

# The workload clients of keycloak/realm.yaml; songmaker lists tools, so it names its MCP origin.
[apps.songmaker]
workload_client = "songmaker"
mcp_origin = "https://songmaker.mcp.internal"

# The copresenter sees only the talk, so presentator lists no tools and no MCP origin.
[apps.presentator]
workload_client = "presentator"

# HopIn's game master lists no tools and no MCP origin either.
[apps.hopin]
workload_client = "hopin"
