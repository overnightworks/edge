# songmaker's MCP origin: only /mcp, to the app's web service on hal_mcp_songmaker; the Host header
# reaches it unchanged.
http:
  routers:
    songmaker:
      rule: Host(`songmaker.mcp.internal`) && Path(`/mcp`)
      entryPoints: [mcp]
      service: songmaker
      tls:
        certResolver: internal
  services:
    songmaker:
      loadBalancer:
        servers:
          - url: http://songmaker-web:8080
