name: edge

# What both Traefik instances share: one image digest and one hardening.
x-traefik: &traefik
  image: traefik:v3.7.14@sha256:575fa15b135078fe5e50aa847987d96dbddd7b093c172429618404df73f3fa7c
  user: "65534:65534"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

# The MCP origins' names: traefik-mcp answers to them on mcp-ca (step-ca validates the ACME
# challenge there) and on mcp (the clients). step-ca/ca.json's policy allows exactly this suffix.
x-mcp-origins: &mcp-origins [hello.mcp.internal]

services:
  socket-proxy:
    image: wollomatic/socket-proxy:1.13.1@sha256:3935b709275e4ec35d6ed5a5c4a1f0d01ed31eec5e7234efc3357ecd47689002
    restart: unless-stopped
    user: "65534:${DOCKER_GID:?set DOCKER_GID to the host docker group id, see .env.example}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    # socket-proxy wraps every allow pattern in ^...$ itself; every method without an -allow flag is refused.
    command:
      - "-socketpath=/var/run/docker.sock"
      - "-proxysocketendpoint=/run/socket-proxy/proxy.sock"
      - "-proxysocketendpointfilemode=0600"
      - '-allowGET=/v1\.[0-9]+/(version|events|containers/json|containers/[a-zA-Z0-9_.-]+/json)'
      - "-allowHEAD=/_ping"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # The directory, not the socket, is shared: the proxy recreates proxy.sock on every start.
      - socket-proxy-run:/run/socket-proxy

  traefik:
    <<: *traefik
    restart: unless-stopped
    depends_on: [socket-proxy]
    network_mode: host
    environment:
      EDGE_DOMAIN: ${EDGE_DOMAIN:?set EDGE_DOMAIN}
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/dynamic:ro
      - socket-proxy-run:/run/socket-proxy:ro

  hello:
    image: &whoami traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
    profiles: [probe]
    networks: [edge-probe]
    labels:
      traefik.enable: "true"
      edge.name: hello
      traefik.http.services.hello.loadbalancer.server.port: "80"


  keycloak-db:
    profiles: [keycloak]
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    # The alpine image's postgres user; the named volume inherits the image's ownership of the data directory.
    user: "70:70"
    read_only: true
    tmpfs: [/var/run/postgresql, /tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [keycloak]
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak_db_password
    secrets: [keycloak_db_password]
    volumes:
      - keycloak-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "--username=keycloak", "--dbname=keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    profiles: [keycloak]
    image: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    restart: unless-stopped
    depends_on:
      keycloak-db:
        condition: service_healthy
    # No read_only: `start` without --optimized rebuilds the server into the image's lib directory at boot.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [keycloak]
    # Secrets reach the process from /run/secrets, never through the container's Config.Env.
    entrypoint: ["/opt/edge/entrypoint.sh", "/opt/keycloak/bin/kc.sh"]
    command: ["start"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_HOSTNAME: https://auth.${EDGE_DOMAIN:?set EDGE_DOMAIN}
      # The one owner of the admin front end; the apply reads it for master.yaml's frontendUrl.
      KC_HOSTNAME_ADMIN: &admin-hostname http://localhost:8090
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
      # TLS ends at Cloudflare; Traefik forwards plain HTTP from the host side of the keycloak network.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # The keycloak network's subnet (networks.keycloak below takes it from here).
      KC_PROXY_TRUSTED_ADDRESSES: &keycloak-subnet 172.31.253.0/24
    secrets:
      - source: keycloak_db_password
        target: KC_DB_PASSWORD
    volumes:
      - ./keycloak/entrypoint.sh:/opt/edge/entrypoint.sh:ro
      - ./keycloak/themes/hallucinai:/opt/keycloak/themes/hallucinai:ro
    labels:
      traefik.enable: "true"
      edge.name: auth
      traefik.http.services.auth.loadbalancer.server.port: "8080"
      # The tunnel reaches only the hallucinai realm, its localization and the static resources
      # under Keycloak's five-character resources version. Any wider /resources/ prefix admits
      # /resources/master/…, the master realm's localization texts.
      traefik.http.routers.auth.entrypoints: edge
      traefik.http.routers.auth.service: auth
      traefik.http.routers.auth.rule: >-
        Host(`auth.${EDGE_DOMAIN}`) && (PathPrefix(`/realms/hallucinai/`)
        || PathPrefix(`/resources/hallucinai/`) || PathRegexp(`^/resources/[a-z0-9]{5}/`))
      # The admin console and the master realm answer on the loopback-only admin entrypoint.
      traefik.http.routers.auth-admin.entrypoints: admin
      traefik.http.routers.auth-admin.service: auth
      traefik.http.routers.auth-admin.rule: Host(`localhost`)

  keycloak-config-cli:
    image: adorsys/keycloak-config-cli:6.5.1-26.5.5@sha256:0955d98c8a341898b7aa177477edf8a1e90569ae50bbe7598141c1270b773274
    profiles: [apply]
    depends_on: [keycloak]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [keycloak]
    entrypoint: ["/opt/edge/entrypoint.sh", "java", "-jar", "/app/keycloak-config-cli.jar"]
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 180s
      KEYCLOAK_GRANTTYPE: client_credentials
      KEYCLOAK_CLIENTID: config-cli
      IMPORT_FILES_LOCATIONS: file:/config/master.yaml,file:/config/realm.yaml
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      IMPORT_VARSUBSTITUTION_UNDEFINEDISERROR: "true"
      KC_HOSTNAME_ADMIN: *admin-hostname
    secrets:
      - source: keycloak_config_cli_secret
        target: KEYCLOAK_CLIENTSECRET
      - source: keycloak_config_cli_secret
        target: CONFIG_CLI_CLIENT_SECRET
      - source: keycloak_client_songmaker
        target: SONGMAKER_CLIENT_SECRET
    volumes:
      - ./keycloak/entrypoint.sh:/opt/edge/entrypoint.sh:ro
      - ./keycloak:/config:ro

  # Reads both realms through the admin API, GET only, and prints one JSON inventory
  # (src/edge/realm/observe.py). No depends_on: an observe never starts Keycloak. Run it as
  # `compose run -T --rm realm-observer [--base-url URL]` with the per-run digest key on stdin.
  realm-observer:
    # The probe's python pin (probe/keycloak/compose.probe.yaml); ci.yml checks the two are equal.
    image: python:3.13.16-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
    profiles: [apply]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [keycloak]
    # -I ignores the PYTHON* environment, so -B is what keeps bytecode unwritten.
    entrypoint:
      - python
      - -I
      - -B
      - /opt/observer/observe.py
    command: ["--base-url", "http://keycloak:8080"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    secrets:
      - source: keycloak_config_cli_secret
        target: config_cli_secret
    volumes:
      - ./src/edge/realm/observe.py:/opt/observer/observe.py:ro

  step-ca:
    profiles: [step-ca]
    image: smallstep/step-ca:0.30.2@sha256:a2b17872915c193259b75a5474c398326f41bd199f0842093e52cf4182bc8270
    restart: unless-stopped
    # The image's own user; step-ca/init makes the volume's files for it.
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    # The image's step-ca binary carries a file capability for low ports; without it in the
    # bounding set the kernel refuses to exec it (verified on 0.30.2). The CA itself listens on 9000.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    # Only the internal network: no route out, no published port. traefik-mcp joins it.
    networks: [mcp-ca]
    # Not the image's entrypoint: its init path would print an admin password into the log.
    entrypoint: ["/usr/local/bin/step-ca"]
    command:
      - "--password-file=/run/secrets/step_ca_password"
      - "/etc/step-ca/ca.json"
    secrets: [step_ca_password]
    volumes:
      - ./step-ca/ca.json:/etc/step-ca/ca.json:ro
      # Intermediate certificate and key, the root certificate and the db; never the root key.
      - step-ca:/home/step

  # Gives the ACME volume to uid 65534: a new named volume belongs to root, and traefik-mcp is
  # read_only and not root.
  traefik-mcp-acme-owner:
    <<: *traefik
    profiles: [step-ca]
    user: "0:0"
    cap_add: [CHOWN]
    restart: "no"
    network_mode: none
    entrypoint: ["chown", "65534:65534", "/acme"]
    volumes:
      - traefik-mcp-acme:/acme

  # The second Traefik: the one gateway between the agent service and the MCP servers. No host
  # networking, no Docker API; the only container on all three MCP networks.
  traefik-mcp:
    <<: *traefik
    profiles: [step-ca]
    restart: unless-stopped
    # Traefik asks the CA once when it starts and does not ask again if the CA was not there; with
    # an empty ACME storage nothing is left to renew. service_started does not wait for the CA and
    # the daemon starts containers unordered after its own restart, so the wait is here. With a
    # stored certificate it starts at once and renews later.
    entrypoint:
      - sh
      - -c
      - |
        trap 'exit 143' TERM
        grep -qs '"certificate"' /acme/acme.json || {
          echo 'traefik-mcp: waiting for step-ca:9000' >&2
          until nc -z step-ca 9000; do sleep 1; done
        }
        exec traefik
    depends_on:
      step-ca: {condition: service_started}
      traefik-mcp-acme-owner: {condition: service_completed_successfully}
    # The entrypoint listens on 443 as uid 65534.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    networks:
      mcp-ca: {aliases: *mcp-origins}
      mcp: {aliases: *mcp-origins}
      mcp-backends: {}
    secrets: [step_ca_root_certificate]
    volumes:
      - ./traefik-mcp.yml:/etc/traefik/traefik.yml:ro
      - ./mcp/dynamic:/mcp/dynamic:ro
      # Issued certificates; not backed up, they are issued again.
      - traefik-mcp-acme:/acme

  # The probe's MCP server behind traefik-mcp (mcp/dynamic/hello.yml); plain HTTP, mcp-backends only.
  hello-mcp:
    image: *whoami
    profiles: [probe]
    networks: [mcp-backends]
volumes:
  socket-proxy-run:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=65534,gid=65534,mode=0700"
  keycloak-db:
  step-ca:
  traefik-mcp-acme:

secrets:
  # Files only, outside the repository; README "Keycloak secrets" names how to create them.
  keycloak_db_password:
    file: ${HOME}/.secrets/keycloak/db-password
  keycloak_config_cli_secret:
    file: ${HOME}/.secrets/keycloak/config-cli-secret
  keycloak_client_songmaker:
    file: ${HOME}/.secrets/keycloak/clients/songmaker
  # step-ca/init creates it; README "Interne CA".
  step_ca_password:
    file: ${HOME}/.secrets/step-ca/password
  # The same init makes it; traefik-mcp trusts the CA through it alone.
  step_ca_root_certificate:
    file: ${HOME}/.secrets/step-ca/root_ca.crt

networks:
  edge-probe:
    driver: bridge
  # step-ca's own network: internal, so it has no route to the internet or other networks (Docker
  # still lets its containers reach host services through the gateway address).
  mcp-ca:
    internal: true
  # The agent service and traefik-mcp; the clients never see step-ca or the backends.
  mcp:
    internal: true
  # traefik-mcp and the apps' MCP servers.
  mcp-backends:
    internal: true
  keycloak:
    driver: bridge
    ipam:
      config:
        # Pinned so KC_PROXY_TRUSTED_ADDRESSES names exactly the network Traefik reaches Keycloak through.
        - subnet: *keycloak-subnet
