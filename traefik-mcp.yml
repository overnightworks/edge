# The static configuration of traefik-mcp (compose.yaml). One entrypoint on 443 inside the MCP
# networks, certificates from step-ca. The global, log and hardening blocks are copies of
# traefik.yml's; a CI check holds them equal. The api, ping and metrics blocks stay absent.
global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

entryPoints:
  mcp:
    address: ":443"
    http:
      aliasHeadersStrategy: delete
      sanitizePath: true
      encodedCharacters:
        allowEncodedSlash: false
        allowEncodedBackSlash: false
        allowEncodedNullCharacter: false
        allowEncodedSemicolon: false
        allowEncodedPercent: false
        allowEncodedQuestionMark: false
        allowEncodedHash: false
      # TLS on every router of this entrypoint; each router names its resolver.
      tls: {}

certificatesResolvers:
  internal:
    acme:
      caServer: https://step-ca:9000/acme/acme/directory
      # Only the CA's own root is trusted, not the system store.
      caCertificates: [/run/secrets/step_ca_root_certificate]
      caSystemCertPool: false
      # step-ca's lifetime (ca.json keeps the default of 24 hours); tests/test_traefik_mcp.py pins both.
      certificatesDuration: 24
      storage: /acme/acme.json
      tlsChallenge: {}

providers:
  file:
    directory: /mcp/dynamic
    watch: true
