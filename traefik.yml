global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

# Two loopback entrypoints: `edge` is the tunnel target, `admin` serves the Keycloak admin console
# locally and is never a tunnel target. The api, ping and metrics blocks stay absent, so those
# features are disabled.
entryPoints:
  edge:
    address: "127.0.0.1:8081"
    # A router that names no entrypoint binds only here, never to `admin`.
    asDefault: true
    forwardedHeaders:
      trustedIPs: ["127.0.0.1/32"]
    http: &hardening
      # Drop headers like X_Forwarded_For that CGI/WSGI-style backends read as the header Traefik manages.
      aliasHeadersStrategy: delete
      # Traefik 3.7 allows encoded path characters by default; reject them so no app sees a traversal.
      sanitizePath: true
      encodedCharacters:
        allowEncodedSlash: false
        allowEncodedBackSlash: false
        allowEncodedNullCharacter: false
        allowEncodedSemicolon: false
        allowEncodedPercent: false
        allowEncodedQuestionMark: false
        allowEncodedHash: false
  admin:
    address: "127.0.0.1:8090"
    # No trusted forwarders: a browser talks to this entrypoint directly.
    http: *hardening

providers:
  docker:
    endpoint: "unix:///run/socket-proxy/proxy.sock"
    exposedByDefault: false
    constraints: "LabelRegex(`edge.name`, `^[a-z0-9-]{1,63}$`)"
    defaultRule: 'Host(`{{ index .Labels "edge.name" }}.{{ env "EDGE_DOMAIN" }}`)'
  file:
    directory: /dynamic
    watch: true
