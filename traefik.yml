global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

# One entrypoint only. The api, ping and metrics blocks stay absent, so those features are disabled.
entryPoints:
  edge:
    address: "127.0.0.1:8081"
    forwardedHeaders:
      trustedIPs: ["127.0.0.1/32"]
    http:
      # Drop headers like X_Forwarded_For that CGI/WSGI-style backends read as the header Traefik manages.
      aliasHeadersStrategy: delete
      # Traefik 3.7 allows encoded path characters by default; reject them so no app sees a traversal.
      sanitizePath: true
      encodedCharacters:
        allowEncodedSlash: false
        allowEncodedBackSlash: false
        allowEncodedNullCharacter: false
        allowEncodedSemicolon: false
        allowEncodedPercent: false
        allowEncodedQuestionMark: false
        allowEncodedHash: false

providers:
  docker:
    endpoint: "unix:///run/socket-proxy/proxy.sock"
    exposedByDefault: false
    constraints: "LabelRegex(`edge.name`, `^[a-z0-9-]{1,63}$`)"
    defaultRule: 'Host(`{{ index .Labels "edge.name" }}.{{ env "EDGE_DOMAIN" }}`)'
  file:
    directory: /dynamic
    watch: true
