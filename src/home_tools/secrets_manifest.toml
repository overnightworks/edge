# Every secret of this PC by name, place and link. Never a value.
#
# One [[secret]] block per entry. Keys:
#   name        unique name the view shows
#   kind        human-password | tool-login | token | service-password | derived-mirror
#   paths       where it lives, "~/"-relative; only the last part may hold a wildcard
#   read_by     who reads it (declared, shown by `home secrets --by-service`)
#   recreate    how and where it is created again
#   verify      optional probe; today only "gh auth status"
#   retired_on  with revoke_url: the entry is retired and its revocation is unconfirmed
#   mirror_of   required for derived-mirror: the entry it is derived from

[[secret]]
name = "gitlab"
kind = "token"
paths = ["~/.secrets/gitlab"]
read_by = [".bashrc"]
recreate = "https://code.siemens.com/-/user_settings/personal_access_tokens"

[[secret]]
name = "sonarcloud/token"
kind = "token"
paths = ["~/.secrets/sonarcloud/token"]
read_by = ["SONAR_TOKEN in overnightworks/songmaker (CI)"]
recreate = "https://sonarcloud.io/account/security"

[[secret]]
name = "claudebot.env"
kind = "token"
paths = ["~/.secrets/claudebot.env"]
read_by = ["agent-telegram.service"]
recreate = "BotFather /revoke, dann neues Token: https://t.me/BotFather"

[[secret]]
name = "cloudflared"
kind = "tool-login"
paths = ["~/.secrets/cloudflared/*.json", "~/.secrets/cloudflared/cert.pem"]
read_by = ["cloudflared.service"]
recreate = "`cloudflared tunnel login` im Browser, dann die Tunnel-Credentials"

[[secret]]
name = "gmail-cleanup"
kind = "token"
paths = ["~/.secrets/gmail-cleanup/*"]
read_by = ["git/gmail-cleanup"]
recreate = "OAuth-Client: https://console.cloud.google.com/apis/credentials, dann Zustimmung im Browser"

[[secret]]
name = "ssh/id_ed25519"
kind = "tool-login"
paths = ["~/.ssh/id_ed25519"]
read_by = ["ssh", "git"]
recreate = "`ssh-keygen -t ed25519`, öffentlichen Schlüssel eintragen: https://github.com/settings/keys"

[[secret]]
name = "ssh/id_ed25519.ppk"
kind = "derived-mirror"
paths = ["~/.ssh/id_ed25519.ppk"]
read_by = ["ssh", "git"]
recreate = "`puttygen ~/.ssh/id_ed25519 -o ~/.ssh/id_ed25519.ppk`"
mirror_of = "ssh/id_ed25519"

[[secret]]
name = "gh"
kind = "tool-login"
paths = ["~/.config/gh"]
read_by = ["gh"]
recreate = "`gh auth login --web`"
verify = "gh auth status"

[[secret]]
name = "claude"
kind = "tool-login"
paths = ["~/.claude"]
read_by = ["claude"]
recreate = "`claude`, dann /login im Browser"

[[secret]]
name = "codex"
kind = "tool-login"
paths = ["~/.codex"]
read_by = ["codex"]
recreate = "`codex login` im Browser"

[[secret]]
name = "songmaker"
kind = "tool-login"
paths = ["~/.songmaker"]
read_by = ["songmaker"]
recreate = "Browser-Login von songmaker"

[[secret]]
name = "github/token"
kind = "token"
paths = ["~/.secrets/github/token"]
read_by = []
recreate = "nicht neu anlegen: gh nutzt seinen Keyring-Login"
retired_on = 2026-10-14
revoke_url = "https://github.com/settings/tokens"

[[secret]]
name = "github/overnightworks-read-token"
kind = "token"
paths = ["~/.secrets/github/overnightworks-read-token"]
read_by = []
recreate = "nicht neu anlegen"
retired_on = 2026-10-14
revoke_url = "https://github.com/settings/personal-access-tokens"
