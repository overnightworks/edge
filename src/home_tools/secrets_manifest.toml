# Every secret of this PC by name, place and link. Never a value.
#
# One [[secret]] block per entry. Keys:
#   name        unique name the view shows
#   kind        human-password | tool-login | token | service-password | derived-mirror,
#               or configuration | documentation for a known file under ~/.secrets that holds no secret
#   paths       where it lives, "~/"-relative; only the last part may hold a wildcard
#   read_by     who reads it (declared, shown by `home secrets --by-service`)
#   recreate    how and where it is created again
#   verify      optional probe of the view; today only "gh auth status"
#   retired_on  with revoke_url: the entry is retired and its revocation is unconfirmed
#   revocation_confirmed  optional, retired entries only: the date the revocation was checked at the provider
#   mirror_of   required for derived-mirror: the entry it is derived from
#   purpose     optional: one sentence, what breaks without it; `--setup` says it before each step
#   optional    optional, true: its absence is no finding and `--setup` skips it
#   elsewhere   optional: copies outside the home, named in the view's "Ort" column and never read
#   loosest_mode         optional: the loosest mode a file of the entry may have, as a TOML octal (0o644); without it 0600.
#                        Never looser than 0644. Only for a file a container user must read in a 0700 folder.
#   loosest_mode_reason  required with loosest_mode: one line, who needs it and why
#
# A token `home secrets --setup` guides through names where it is created, all four keys together:
#   provider         github | cloudflare
#   resource         GitHub: the resource owner; Cloudflare: the zone the token reaches
#   scope            the rights to grant; GitHub: "<URL parameter>:read|write|admin" as its token form takes them,
#                    Cloudflare: "<group> › <permission> › <level>" as its dashboard spells them
#   expires_in_days  1 to 366; GitHub takes it as expires_in, Cloudflare as the TTL's end date
# The rights follow overnightworks/edge docs/architecture.md (layer L3, section 4, D6 and D8) and edge#30.
# A service-password entry has one path; `--setup` generates its value and never shows it, unless the entry is optional:
# then the unit named in `recreate` writes it.
#
# The five entries of `edge external` come first, so `--setup` walks the ones `plan` reads before the ones `apply` reads;
# the two GitHub tokens are read by nothing until edge#30 X2/X3.

[[secret]]
name = "cloudflare/fleet-read"
kind = "token"
paths = ["~/.secrets/cloudflare/fleet-read"]
read_by = ["edge external plan", "edge external check", "edge external apply", "edge apply"]
recreate = "https://dash.cloudflare.com/profile/api-tokens"
purpose = "edge external plan, check und apply lesen damit DNS, Access, den Tunnel, die Zoneneinstellungen (HSTS) und die Transform-Regel der Besucheradresse bei Cloudflare, ohne etwas zu ändern."
provider = "cloudflare"
resource = "hallucinai.de"
scope = [
    "Account › Cloudflare Tunnel › Read",
    "Account › Access: Apps and Policies › Read",
    "Account › Access: Organizations, Identity Providers, and Groups › Read",
    "Account › Access: Service Tokens › Read",
    "Zone › Zone › Read",
    "Zone › DNS › Read",
    "Zone › Zone Settings › Read",
    "Zone › Transform Rules › Read",
]
expires_in_days = 366

[[secret]]
name = "github/fleet-read"
kind = "token"
paths = ["~/.secrets/github/fleet-read"]
read_by = []
recreate = "https://github.com/settings/personal-access-tokens/new"
purpose = "Nichts liest es heute; edge external verlangt es erst wieder, wenn edge#30 X2/X3 die GitHub-Einstellungen als Code baut (Repo-Einstellungen, Rulesets, Actions-Regeln, Namen der Org-Secrets, nie ihre Werte). Die Datei bleibt, widerrufen wird nichts."
provider = "github"
resource = "overnightworks"
scope = [
    "metadata:read",
    "administration:read",
    "repository_custom_properties:read",
    "secrets:read",
    "dependabot_secrets:read",
    "organization_administration:read",
    "organization_custom_properties:read",
    "organization_secrets:read",
    "organization_dependabot_secrets:read",
]
expires_in_days = 366

[[secret]]
name = "opentofu/state-passphrase"
kind = "service-password"
paths = ["~/.secrets/opentofu/state-passphrase"]
read_by = ["edge external plan", "edge external apply", "edge apply"]
recreate = "home secrets --setup erzeugt sie; verloren heißt: der verschlüsselte OpenTofu-State ist unlesbar"
purpose = "OpenTofu verschlüsselt damit State und Plan unter ~/.secrets/opentofu."

[[secret]]
name = "cloudflare/fleet-write"
kind = "token"
paths = ["~/.secrets/cloudflare/fleet-write"]
read_by = ["edge external apply", "edge apply"]
recreate = "https://dash.cloudflare.com/profile/api-tokens"
purpose = "edge external apply schreibt damit DNS, Access-Apps, die Tunnel-Zeilen, die Zoneneinstellungen (HSTS) und die Transform-Regel der Besucheradresse bei Cloudflare; nur der Betreiber wendet an."
provider = "cloudflare"
resource = "hallucinai.de"
scope = [
    "Account › Cloudflare Tunnel › Edit",
    "Account › Access: Apps and Policies › Edit",
    "Account › Access: Organizations, Identity Providers, and Groups › Read",
    "Zone › Zone › Read",
    "Zone › DNS › Edit",
    "Zone › Zone Settings › Edit",
    "Zone › Transform Rules › Edit",
]
expires_in_days = 366

[[secret]]
name = "github/fleet-admin"
kind = "token"
paths = ["~/.secrets/github/fleet-admin"]
read_by = []
recreate = "https://github.com/settings/personal-access-tokens/new"
purpose = "Nichts liest es heute; edge external apply verlangt es erst wieder, wenn edge#30 X2/X3 die GitHub-Einstellungen als Code baut (Repo-Einstellungen, Rulesets, Actions-Regeln, Reichweite der Org-Secrets; nur der Betreiber wendet an). Die Datei bleibt, widerrufen wird nichts."
provider = "github"
resource = "overnightworks"
scope = [
    "metadata:read",
    "administration:write",
    "repository_custom_properties:write",
    "secrets:read",
    "dependabot_secrets:read",
    "organization_administration:write",
    "organization_custom_properties:admin",
    "organization_secrets:write",
    "organization_dependabot_secrets:write",
]
expires_in_days = 366

# What tofu leaves under ~/.secrets/opentofu: encrypted with opentofu/state-passphrase and written for the owner only, so no secret in the clear.
# The first plan or apply creates them, so their absence is no finding. Each file is named exactly, so any other file beside them stays an unknown-file.
[[secret]]
name = "opentofu/state"
kind = "configuration"
paths = ["~/.secrets/opentofu/fleet.tfstate"]
read_by = ["edge external plan", "edge external apply", "edge apply"]
recreate = "nicht neu erzeugbar: verloren heißt, plan zeigt alles als neu; die Ressourcen erst importieren, dann anwenden"
purpose = "OpenTofu merkt sich darin, welche Ressourcen es verwaltet."
optional = true

[[secret]]
name = "opentofu/state-backup"
kind = "configuration"
paths = ["~/.secrets/opentofu/fleet.tfstate.backup"]
read_by = ["edge external apply", "edge apply"]
recreate = "nicht neu erzeugbar: tofu schreibt sie nur, wenn ein Apply einen bestehenden State ändert; verloren kostet nur diese eine Rücksicherung"
purpose = "OpenTofu legt darin die vorige Fassung des States ab, gesichert beim letzten Apply, das ihn geändert hat; vor dem ersten solchen Apply gibt es sie nicht."
optional = true

[[secret]]
name = "opentofu/plans"
kind = "configuration"
paths = ["~/.secrets/opentofu/plans"]
read_by = ["edge external plan", "edge external apply", "edge apply"]
recreate = "edge external apply plant neu; ein verlorener Plan kostet nur den Plan-Lauf"
purpose = "edge external apply speichert darin den verschlüsselten Plan, den der Betreiber freigibt."
optional = true

[[secret]]
name = "opentofu/tmp"
kind = "configuration"
paths = ["~/.secrets/opentofu/tmp"]
read_by = ["edge external plan", "edge external apply", "edge apply"]
recreate = "edge external plan legt den Ordner selbst an"
purpose = "OpenTofu bekommt darin ein privates TMPDIR, das nach jedem Lauf geleert wird."
optional = true

# The files step-ca/init and keycloak/go-live write. Their containers run as other users, so a file may be 0644 inside its 0700 folder.
# Each unit's own --check owns presence, so every entry is optional: the daily check judges the modes and never reports one missing.
[[secret]]
name = "step-ca/root_ca_key"
kind = "token"
paths = ["~/.secrets/step-ca/root_ca_key"]
read_by = ["step-ca/init"]
recreate = "step-ca/init; ein neuer Schlüssel macht jedes bisher ausgestellte Zertifikat und die Wurzel in den Clients ungültig"
purpose = "Der Wurzelschlüssel der internen CA; nur step-ca/init liest ihn, in einem Einmal-Container ohne Netz, nie im laufenden Dienst."
optional = true

[[secret]]
name = "step-ca/password"
kind = "service-password"
paths = ["~/.secrets/step-ca/password"]
read_by = ["step-ca"]
recreate = "step-ca/init; ohne das alte Passwort sind die Schlüssel der CA nicht mehr lesbar"
purpose = "Das Passwort der CA schützt den Wurzel- und den Zwischenschlüssel; der Dienst liest es als Docker-Secret."
optional = true
loosest_mode = 0o644
loosest_mode_reason = "step-ca liest es im Container als uid 1000; der 0700-Ordner hält alle anderen aus"

[[secret]]
name = "step-ca/root_ca.crt"
kind = "configuration"
paths = ["~/.secrets/step-ca/root_ca.crt"]
read_by = ["traefik-mcp", "step-ca"]
recreate = "step-ca/init"
purpose = "Das Wurzelzertifikat der internen CA; enthält kein Geheimnis. Ohne es vertraut traefik-mcp der CA nicht."
optional = true
loosest_mode = 0o644
loosest_mode_reason = "traefik-mcp liest es als uid 65534"

# The folder exists only while an init was interrupted; its two files are the key and the certificate on their way to their place,
# under the names `create_root` in step-ca/init gives them.
[[secret]]
name = "step-ca/pending-root/root_ca_key"
kind = "token"
paths = ["~/.secrets/step-ca/.pending-root/root_ca_key"]
read_by = ["step-ca/init"]
recreate = "step-ca/init setzt eine unterbrochene Einrichtung fort und räumt den Ordner auf"
purpose = "Der Wurzelschlüssel auf dem Weg an seinen Platz; er bleibt 0600."
optional = true

[[secret]]
name = "step-ca/pending-root/root_ca.crt"
kind = "configuration"
paths = ["~/.secrets/step-ca/.pending-root/root_ca.crt"]
read_by = ["step-ca/init"]
recreate = "step-ca/init setzt eine unterbrochene Einrichtung fort und räumt den Ordner auf"
purpose = "Das Wurzelzertifikat auf dem Weg an seinen Platz; enthält kein Geheimnis."
optional = true
loosest_mode = 0o644
loosest_mode_reason = "init setzt es auf 0644, wenn es es veröffentlicht"

[[secret]]
name = "keycloak/db-password"
kind = "service-password"
paths = ["~/.secrets/keycloak/db-password"]
read_by = ["keycloak", "keycloak-db"]
recreate = "keycloak/go-live legt nur eine fehlende Datei an; ein neues Passwort passt nicht zur bestehenden Datenbank"
purpose = "Das Passwort des Keycloak-Datenbanknutzers."
optional = true
loosest_mode = 0o644
loosest_mode_reason = "die Container lesen es als ihr eigener Nutzer; der 0700-Ordner hält alle anderen aus"

[[secret]]
name = "keycloak/config-cli-secret"
kind = "service-password"
paths = ["~/.secrets/keycloak/config-cli-secret"]
read_by = ["keycloak", "keycloak-config-cli"]
recreate = "keycloak/go-live legt nur eine fehlende Datei an"
purpose = "Das Client-Secret, mit dem keycloak-config-cli den Realm anwendet."
optional = true
loosest_mode = 0o644
loosest_mode_reason = "die Container lesen es als ihr eigener Nutzer; der 0700-Ordner hält alle anderen aus"

[[secret]]
name = "keycloak/bootstrap-admin-password"
kind = "service-password"
paths = ["~/.secrets/keycloak/bootstrap-admin-password"]
read_by = ["keycloak"]
recreate = "keycloak/go-live"
purpose = "Das Passwort des vorläufigen Administrators; keycloak/go-live löscht die Datei im Schritt 7, danach fehlt sie zu Recht."
optional = true
loosest_mode = 0o644
loosest_mode_reason = "der Keycloak-Container liest es als sein eigener Nutzer; der 0700-Ordner hält alle anderen aus"

[[secret]]
name = "keycloak/clients/*"
kind = "token"
paths = ["~/.secrets/keycloak/clients/*"]
read_by = ["keycloak-config-cli", "edge"]
recreate = "keycloak/go-live legt nur eine fehlende Datei an, eine je vertraulichem Client"
purpose = "Je vertraulichem Client des Realms eine Datei mit seinem Secret."
optional = true
loosest_mode = 0o644
loosest_mode_reason = "die Container lesen sie als ihr eigener Nutzer; der 0700-Ordner hält alle anderen aus"

# The agent service's subscription login: one line, the token `claude setup-token` prints, which the operator writes himself
# (edge docs/agent-service.md, "The login"). The service reads the folder through a read-only directory bind, and a renewal writes
# `token.new` beside `token` and renames it over; both names are known, so the renewal shows no unknown file.
[[secret]]
name = "agent-service-claude"
kind = "token"
paths = ["~/.secrets/agent-service/claude/token*"]
read_by = ["agent-service"]
recreate = "edge: agent-service/setup --renew (fragt nach der Zeile aus `claude setup-token`, ohne sie anzuzeigen); edge docs/agent-service.md"
purpose = "Der Abo-Login des Agent-Dienstes für Claude; ohne ihn startet der Dienst nicht."
optional = true

[[secret]]
name = "restic/password"
kind = "human-password"
paths = ["~/.secrets/restic/password"]
read_by = ["edge-backup.service", "edge-backup-restore-test.service"]
recreate = "Aus deinem Passwortmanager zurückholen. Nie neu erzeugen, solange unter ~/backups/restic Backups liegen: ein neues Passwort macht sie unlesbar."
purpose = "edge-backup verschlüsselt damit die restic-Backups; ohne es sind sie unlesbar."

[[secret]]
name = "gitlab"
kind = "token"
paths = ["~/.secrets/gitlab"]
read_by = [".bashrc"]
recreate = "https://code.siemens.com/-/user_settings/personal_access_tokens"

[[secret]]
name = "sonarcloud/token"
kind = "token"
paths = ["~/.secrets/sonarcloud/token"]
read_by = ["SONAR_TOKEN in overnightworks/songmaker (CI)"]
recreate = "https://sonarcloud.io/account/security"

[[secret]]
name = "claudebot.env"
kind = "token"
paths = ["~/.secrets/claudebot.env"]
read_by = ["agent-telegram.service"]
recreate = "BotFather /revoke, dann neues Token: https://t.me/BotFather"

# Not a secret, ruled as decision U5 in overnightworks/home-tools#10; like secrets/README optional, so its absence is no finding.
[[secret]]
name = "claudebot-runtime.env"
kind = "configuration"
paths = ["~/.secrets/claudebot-runtime.env"]
read_by = ["agent-telegram.service"]
recreate = "~/.secrets/claudebot-runtime.env anlegen, Schlüssel wie in ~/git/claudebot/README.md (kein Geheimnis)"
optional = true

[[secret]]
name = "secrets/README"
kind = "documentation"
paths = ["~/.secrets/README"]
read_by = []
recreate = "~/.secrets/README anlegen: je Datei eine Zeile, was sie ist (kein Geheimnis)"
optional = true

[[secret]]
name = "cloudflared"
kind = "tool-login"
paths = ["~/.secrets/cloudflared/cert.pem"]
read_by = ["cloudflared tunnel (Verwaltung)"]
recreate = "`cloudflared tunnel login` im Browser"
elsewhere = "Tunnel-Config und Zugangsdatei des laufenden Tunnels: /etc/cloudflared (root)"

[[secret]]
name = "cloudflared/tunnel"
kind = "tool-login"
paths = ["~/.secrets/cloudflared/a903516a-2660-4507-90a5-5a27d20c82c4.json"]
read_by = ["cloudflared tunnel run (von Hand; credentials-file in /etc/cloudflared/config.yml)"]
recreate = "`cloudflared tunnel create` (neuer Tunnel) oder die Datei aus /etc/cloudflared kopieren"
elsewhere = "/etc/cloudflared (root), die Kopie, die der laufende Tunnel über LoadCredential liest"

[[secret]]
name = "gmail-cleanup"
kind = "token"
paths = ["~/.secrets/gmail-cleanup/*"]
read_by = ["git/gmail-cleanup"]
recreate = "OAuth-Client: https://console.cloud.google.com/apis/credentials, dann Zustimmung im Browser"

[[secret]]
name = "ssh/id_ed25519"
kind = "tool-login"
paths = ["~/.ssh/id_ed25519"]
read_by = ["ssh", "git"]
recreate = "`ssh-keygen -t ed25519`, öffentlichen Schlüssel eintragen: https://github.com/settings/keys"

[[secret]]
name = "ssh/id_ed25519.ppk"
kind = "derived-mirror"
paths = ["~/.ssh/id_ed25519.ppk"]
read_by = ["ssh", "git"]
recreate = "`puttygen ~/.ssh/id_ed25519 -o ~/.ssh/id_ed25519.ppk`"
mirror_of = "ssh/id_ed25519"
optional = true

[[secret]]
name = "gh"
kind = "tool-login"
paths = ["~/.config/gh"]
read_by = ["gh"]
recreate = "`gh auth login --web`"
verify = "gh auth status"

[[secret]]
name = "claude"
kind = "tool-login"
paths = ["~/.claude"]
read_by = ["claude"]
recreate = "`claude`, dann /login im Browser"

[[secret]]
name = "claude-measure-token"
kind = "token"
paths = ["~/.secrets/claude-measure-token"]
read_by = ["agent-providers#115, Messläufe 0b2/0e"]
recreate = "`claude setup-token` im Browser"
purpose = "Die Messläufe starten Claude damit unter einem eigenen, widerrufbaren Login."
optional = true

[[secret]]
name = "codex"
kind = "tool-login"
paths = ["~/.codex"]
read_by = ["codex"]
recreate = "`codex login` im Browser"

[[secret]]
name = "songmaker"
kind = "tool-login"
paths = ["~/.songmaker"]
read_by = ["songmaker"]
recreate = "Browser-Login von songmaker"

[[secret]]
name = "github/token"
kind = "token"
paths = ["~/.secrets/github/token"]
read_by = []
recreate = "nicht neu anlegen: gh nutzt seinen Keyring-Login"
retired_on = 2026-10-14
revoke_url = "https://github.com/settings/tokens"
revocation_confirmed = 2026-10-15

[[secret]]
name = "github/overnightworks-read-token"
kind = "token"
paths = ["~/.secrets/github/overnightworks-read-token"]
read_by = []
recreate = "nicht neu anlegen"
retired_on = 2026-10-14
revoke_url = "https://github.com/settings/personal-access-tokens"
revocation_confirmed = 2026-10-15
