# Known listeners beyond loopback. Each entry needs `protocol` (tcp or udp), a
# `reason`, and a `port`, an `owner`, or both. `owner` matches the process name,
# the script or module an interpreter runs, or the socket's system unit (under
# system.slice), so one entry holds whether `hal check exposure` runs as the
# user or as root. A script named like a unit (`avahi-daemon.service`) never
# matches that unit's entry: any user can name a script.
# Docker publications are never allow-listed: they must bind 127.0.0.1 or ::1.

[[allow]]
protocol = "udp"
owner = "avahi-daemon.service"
reason = "mDNS: avahi answers local-network service discovery on 5353 and its own random query ports"

[[allow]]
protocol = "udp"
owner = "NetworkManager.service"
port = 546
reason = "DHCPv6 client on the link-local address, the host's own network configuration"

[[allow]]
protocol = "udp"
owner = "cloudflared.service"
reason = "the Cloudflare tunnel's outbound QUIC sockets on random ports; the tunnel is the edge's only way in"

[[allow]]
protocol = "udp"
owner = "chrome"
port = 5353
reason = "Chrome joins the mDNS multicast group 224.0.0.251 to discover cast and local devices"
