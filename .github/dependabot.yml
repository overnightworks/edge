version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
  # One group per ecosystem, so co-pinned images (realm-observer and probe-rp) move in one pull.
  - package-ecosystem: docker-compose
    directories:
      - /
      - /keycloak
      - /probe/agent-service
      - /probe/keycloak
      - /probe/step-ca
    schedule:
      interval: daily
    groups:
      compose-images:
        patterns: ["*"]
    # A local tag built on the PC, never on a registry.
    ignore:
      - dependency-name: edge-agent-service
  - package-ecosystem: docker
    directories:
      - /agent-service/image
      - /scripts/system-proof
      - /src/edge_backup/images
    schedule:
      interval: daily
    groups:
      dockerfile-images:
        patterns: ["*"]
