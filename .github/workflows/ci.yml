# Static checks only: the edge runs on the operator's host, so CI never starts containers.
# It proves the compose file renders and that the loopback-only, deny-by-default shape holds,
# and it lints and tests edge-check against fixture outputs.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Placeholder values the compose file interpolates; the real ones live in the uncommitted .env.
      EDGE_DOMAIN: hallucinai.de
      DOCKER_GID: "127"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: edge-check installs from the lock file
        run: uv sync --locked --no-build --no-install-project

      - name: edge-check lint
        run: |
          uv run --no-sync --no-build ruff check
          uv run --no-sync --no-build ruff format --check

      - name: edge-check tests
        env:
          PYTHONPATH: src
        run: uv run --no-sync --no-build pytest

      # The wheel must ship both packages, not only the one the editable install happens to find.
      - name: The wheel installs edge-check and edge-backup
        run: |
          uv build --wheel --out-dir dist
          uv run --isolated --no-project --no-build --with dist/*.whl edge-backup --help
          uv run --isolated --no-project --no-build --with dist/*.whl edge-check --help

      - name: Compose renders (default, probe profile, Keycloak bootstrap and probe overlays)
        run: |
          docker compose config -q
          docker compose --profile probe config -q
          docker compose --file compose.yaml --file keycloak/bootstrap.compose.yaml \
            --profile apply config -q
          PROBE_SECRETS_DIR=/nonexistent PROBE_CONFIG_DIR=/nonexistent \
            docker compose --file compose.yaml --file keycloak/bootstrap.compose.yaml \
            --file probe/keycloak/compose.probe.yaml --profile apply config -q

      - name: YAML files parse
        run: |
          python3 -c 'import sys, yaml; [yaml.safe_load(open(f)) for f in sys.argv[1:]]' \
            traefik.yml cloudflared-config.example.yml keycloak/master.yaml keycloak/realm.yaml \
            keycloak/bootstrap.compose.yaml probe/keycloak/compose.probe.yaml

      # Traefik listens on loopback only: the tunnel entrypoint 8081 and the local Keycloak admin
      # entrypoint 8090, and nothing implicit. A router that names no entrypoint binds only `edge`,
      # and each Keycloak router names its own.
      - name: No published ports, Traefik listens on 8081 and 8090 only, routers bind as declared
        run: |
          python3 - <<'PY'
          import re, sys, yaml
          compose = open("compose.yaml").read()
          if re.search(r"^\s*ports:", compose, re.M) or "0.0.0.0" in compose:
              sys.exit("compose.yaml publishes ports or binds 0.0.0.0")
          traefik = yaml.safe_load(open("traefik.yml"))
          forbidden = {"api", "ping", "metrics"} & set(traefik)
          if forbidden:
              sys.exit(f"traefik.yml enables {sorted(forbidden)}")
          addresses = sorted(e["address"] for e in traefik["entryPoints"].values())
          if addresses != ["127.0.0.1:8081", "127.0.0.1:8090"]:
              sys.exit(f"traefik.yml listens on {addresses}")
          flags = {n: e.get("asDefault", False) for n, e in traefik["entryPoints"].items()}
          not_boolean = sorted(n for n, flag in flags.items() if not isinstance(flag, bool))
          if not_boolean:
              sys.exit(f"asDefault is not a boolean on {not_boolean}")
          defaults = sorted(n for n, flag in flags.items() if flag)
          if defaults != ["edge"]:
              sys.exit(f"the default entrypoints are {defaults}, not exactly edge")
          bindings = {}
          for service_name, service in yaml.safe_load(compose)["services"].items():
              labels = service.get("labels") or {}
              routers = {k.split(".")[3] for k in labels if k.startswith("traefik.http.routers.")}
              for router in routers:
                  entrypoints = labels.get(f"traefik.http.routers.{router}.entrypoints")
                  bindings.setdefault(router, []).append((service_name, entrypoints))
          shared = sorted(r for r, owners in bindings.items() if len(owners) > 1)
          if shared:
              sys.exit(f"routers defined by more than one service: {shared}")
          unnamed = sorted(r for r, [(_, entrypoints)] in bindings.items() if not entrypoints)
          if unnamed:
              sys.exit(f"routers without an entrypoint: {unnamed}")
          for router, entrypoint in {"auth": "edge", "auth-admin": "admin"}.items():
              owner = bindings.get(router, [(None, None)])[0]
              if owner != ("keycloak", entrypoint):
                  sys.exit(f"router {router} is {owner}, not keycloak on {entrypoint}")
          PY

      # Unmatched hosts must end at 404, and the wildcard must demand an Access token. The login
      # line alone is public: ahead of the wildcard, without Access, to the edge entrypoint. No
      # line targets the local admin entrypoint 8090.
      - name: Tunnel template denies by default
        run: |
          python3 - <<'PY'
          import re, sys, yaml
          ingress = yaml.safe_load(open("cloudflared-config.example.yml"))["ingress"]
          if ingress[-1].get("service") != "http_status:404":
              sys.exit("last ingress rule is not http_status:404")
          hostnames = [str(r.get("hostname", "")) for r in ingress]
          wildcard = ingress[next(i for i, h in enumerate(hostnames) if h.startswith("*."))]
          access = wildcard.get("originRequest", {}).get("access", {})
          missing = [k for k in ("required", "teamName", "audTag") if not access.get(k)]
          if missing:
              sys.exit(f"wildcard access rule lacks {missing}")
          if hostnames.count("auth.hallucinai.de") != 1:
              sys.exit("there is not exactly one auth.hallucinai.de line")
          auth_index = hostnames.index("auth.hallucinai.de")
          auth = ingress[auth_index]
          if auth_index > hostnames.index(wildcard["hostname"]):
              sys.exit("the auth line comes after the wildcard")
          if auth != {"hostname": "auth.hallucinai.de", "service": "http://127.0.0.1:8081"}:
              sys.exit(f"the auth line is not the bare edge route: {auth}")
          admin_targets = [r for r in ingress if re.search(r":8090\b", str(r.get("service", "")))]
          if admin_targets:
              sys.exit(f"an ingress line targets the admin entrypoint 8090: {admin_targets}")
          PY

      # OpenTofu runs on the operator's host (the wrapper is X1b); CI installs the same pinned tofu.
      - name: Install pinned tofu
        run: |
          cd "$RUNNER_TEMP"
          curl --proto '=https' --proto-redir '=https' -sSfLO https://github.com/opentofu/opentofu/releases/download/v1.13.1/tofu_1.13.1_linux_amd64.zip
          echo "8ccbc6f8ee21d2827715f3c6e08a9b3e0209b1e62057c05067ef117e047c1a80  tofu_1.13.1_linux_amd64.zip" | sha256sum --check
          unzip -q tofu_1.13.1_linux_amd64.zip tofu
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: "#32 X1a rule 1: OpenTofu root is formatted, pinned by the lock file and valid"
        working-directory: external
        run: |
          tofu fmt -check
          tofu init -backend=false -lockfile=readonly
          tofu validate

      # With enforced encryption neither the state nor the plan file may carry a sentinel in plaintext.
      # Matrix per home (clean, and with a planted ~/.tofurc under the wrapper's TF_CLI_CONFIG_FILE):
      # with the passphrase both artifacts show the sentinel; without it neither can be read, planned or applied;
      # a wrong passphrase fails too, so the failure comes from decryption and not from the missing variable.
      - name: "#32 X1a rule 2: OpenTofu state and plan files are encrypted"
        run: |
          set -euo pipefail
          must_fail() { if "$@"; then echo "unexpectedly succeeded: $*" >&2; exit 1; fi; }
          sentinel=SENTINEL-plaintext-marker
          fake_home=$(mktemp -d)
          mkdir "$fake_home/override"
          cat > "$fake_home/.tofurc" <<RC
          provider_installation {
            dev_overrides {
              "integrations/github" = "$fake_home/override"
            }
            direct {}
          }
          RC
          guard="$PWD/external/tofurc"
          prove_encryption() {
            local scenario=$1 work
            work=$(mktemp -d)
            cp external/main.tf external/.terraform.lock.hcl fleet.yaml "$work/"
            mkdir "$work/external" && mv "$work/main.tf" "$work/.terraform.lock.hcl" "$work/external/"
            (
              cd "$work/external"
              printf 'resource "terraform_data" "sentinel" {\n  input = "%s"\n}\n' "$sentinel" > sentinel.tf
              export TF_VAR_state_passphrase=throwaway-test-passphrase
              tofu init -input=false -lockfile=readonly -backend-config=path="$work/test.tfstate"
              tofu apply -input=false -auto-approve
              grep -q encrypted_data "$work/test.tfstate"
              must_fail grep -q "$sentinel" "$work/test.tfstate"
              tofu plan -input=false -out=p.tfplan
              must_fail grep -aq "$sentinel" p.tfplan
              must_fail unzip -tq p.tfplan
              tofu show -json p.tfplan | grep -q "$sentinel"
              tofu show -json | grep -q "$sentinel"
              TF_VAR_state_passphrase=a-different-wrong-passphrase must_fail tofu show -json p.tfplan
              TF_VAR_state_passphrase=a-different-wrong-passphrase must_fail tofu show -json
              unset TF_VAR_state_passphrase
              must_fail tofu show -json p.tfplan
              must_fail tofu show -json
              must_fail tofu plan -input=false
            )
            echo "ENCRYPTION-PROVEN ($scenario)"
          }
          unset TF_CLI_CONFIG_FILE
          prove_encryption "home override absent"
          HOME="$fake_home" TF_CLI_CONFIG_FILE="$guard" prove_encryption "home override present"

      # The wrapper passes external/tofurc as TF_CLI_CONFIG_FILE; a planted ~/.tofurc must not swap a provider.
      - name: "#32 X1a rule 3: A home-directory dev_overrides cannot swap a provider"
        run: |
          set -euo pipefail
          fake_home=$(mktemp -d)
          mkdir "$fake_home/override"
          cat > "$fake_home/.tofurc" <<RC
          provider_installation {
            dev_overrides {
              "integrations/github" = "$fake_home/override"
            }
            direct {}
          }
          RC
          cd external
          rm -rf .terraform
          HOME="$fake_home" tofu init -no-color -backend=false -lockfile=readonly > "$fake_home/planted.txt" 2>&1 || true
          grep -qi "development overrides" "$fake_home/planted.txt"
          rm -rf .terraform
          HOME="$fake_home" TF_CLI_CONFIG_FILE="$PWD/tofurc" tofu init -no-color -backend=false -lockfile=readonly > "$fake_home/guarded.txt" 2>&1
          if grep -qi "development overrides" "$fake_home/guarded.txt"; then echo "override leaked" >&2; exit 1; fi
          grep -q "successfully initialized" "$fake_home/guarded.txt"
          echo OVERRIDE-BLOCKED

      - name: Install pinned gitleaks
        run: |
          cd "$RUNNER_TEMP"
          curl --proto '=https' --proto-redir '=https' -sSfLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks

      # gitleaks finds literal-looking secrets anywhere; the structural rule (a literal in
      # keycloak/*.yaml or any compose file, in block, flow or list style) reads the parsed YAML.
      # tests/test_secret_check.py plants each style, so a check that stops matching turns it red.
      - name: No secret in any file
        run: |
          "$RUNNER_TEMP/gitleaks" dir --no-banner --redact .
          uv run --locked --no-build --script keycloak/secret-check/secret_check.py .
