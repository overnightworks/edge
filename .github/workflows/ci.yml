name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  ci:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The operator's uv, so CI resolves and builds exactly as the README's
      # install does on the machine that runs `home`.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.9"
          python-version: "3.12"

      # `--no-build` keeps any package's build script from running, and this
      # project is built from source too, so the environment holds only the
      # locked wheels: the steps below read the tree through pytest's
      # pythonpath, and the smoke step at the end proves the built package.
      - name: Install dependencies
        run: uv sync --locked --no-build --no-install-project

      - name: Lint
        run: uv run --locked --no-build --no-sync ruff check .

      # The allowlist in the gate states the rule AGENTS.md carries, so a
      # stray root file fails here rather than in a review.
      - name: Check the repository root layout
        run: uv run --locked --no-build --no-sync python scripts/check_root_layout.py

      # The measured sources and the 100 % line-and-branch floor live in
      # pyproject.toml, so this step fails on a coverage gap as well as on a
      # failing test.
      - name: Test with coverage
        run: uv run --locked --no-build --no-sync pytest -q --cov --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload the coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 1

      # The tests import from the tree, so they would pass even if the wheel
      # lacked a module or the console script pointed nowhere. This step
      # installs the built wheel non-editable on purpose -- unlike README.md's
      # editable install, which would run from the checkout and prove nothing
      # about the wheel -- and starts the command from an empty directory with
      # an empty HOME, where nothing of the checkout is on the import path.
      - name: Smoke-test the installed home outside the checkout
        run: |
          smoke="$(mktemp -d)"
          uv build --wheel --out-dir "$smoke/dist"
          UV_TOOL_DIR="$smoke/tools" UV_TOOL_BIN_DIR="$smoke/bin" \
            uv tool install --no-build "$smoke"/dist/home_tools-*.whl
          mkdir "$smoke/home" "$smoke/cwd"
          cd "$smoke/cwd"
          export HOME="$smoke/home"
          "$smoke/bin/home" --help
          "$smoke/bin/home" tidy --help
          "$smoke/bin/home" check --help
          "$smoke/bin/home" secrets --help
          # Reads the packaged secrets_manifest.toml without probing or writing.
          "$smoke/bin/home" secrets --by-service | grep -F "deklarierte Abhängigkeiten"

  quality:
    name: quality
    needs: [ci]
    if: always()
    permissions:
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/gate.yml@75467b7888ab8158dda370c770d3323dfc1f594e # v0.1.1
    with:
      coverage-artifact: coverage
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
