name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  ci:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --no-build

      - name: Lint
        run: uv run --locked --no-build ruff check .

      # The allowlist in the gate states the rule AGENTS.md carries, so a
      # stray root file fails here rather than in a review.
      - name: Check the repository root layout
        run: uv run --locked --no-build python scripts/check_root_layout.py

      # The measured sources and the 100 % line-and-branch floor live in
      # pyproject.toml, so this step fails on a coverage gap as well as on a
      # failing test.
      - name: Test with coverage
        run: uv run --locked --no-build pytest -q --cov --cov-report=term-missing
