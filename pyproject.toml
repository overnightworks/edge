[project]
name = "edge-check"
version = "0.1.0"
description = "The edge tools: the edge command, home, the workstation tool, and hal, the daily door."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "overnightworks-appkit @ https://github.com/overnightworks/appkit/releases/download/v0.5.0/overnightworks_appkit-0.5.0-py3-none-any.whl#sha256=7539a8a42d3e07aaf71e14fae63db0eb59806eb641c18c87abad5b67ea21ada1",
]

[project.scripts]
edge = "edge.cli:main"
home = "home_tools.cli:main"
hal = "hal.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.15"]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["edge", "edge_check", "edge_backup", "home_tools", "hal", "hal_output"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["keycloak/go-live", "step-ca/init", "agent-service/setup"]

[tool.ruff.format]
# home's tree is imported as it is: home-tools#56 / home-tools#45 move its texts.
# Deletion target: home-tools#45, or one mechanical reformat item, whichever lands first.
exclude = ["src/home_tools/**", "tests/home/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Same reason and deletion target as [tool.ruff.format]. E501: home's lines run to 140;
# RUF001: the German strings carry U+203A; I001/RUF009/RUF043/RUF100: single imported lines
# (the last three only in the tests).
"src/home_tools/**" = ["E501", "I001", "RUF001"]
"tests/home/**" = ["E501", "I001", "RUF001", "RUF009", "RUF043", "RUF100"]

[tool.coverage.run]
branch = true
# Measures the Python children the tests start (hal's console script), as pytest-cov 7 no longer does.
patch = ["subprocess"]

# No fail_under: edge is not at 100 %. home's floor is per path, in CI's check job.
[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
pythonpath = ["src", "scripts"]

# hal is the door above the tools it drives; hal_output, which prints for all of them, and
# edge_check are the lowest shared pieces.
[tool.importlinter]
root_packages = ["edge", "edge_check", "edge_backup", "home_tools", "hal", "hal_output"]

[[tool.importlinter.contracts]]
name = "hal sits above edge, which sits above edge_check"
type = "layers"
layers = ["hal", "edge", "edge_check"]

[[tool.importlinter.contracts]]
name = "edge_backup, edge_check and home_tools stand apart"
type = "independence"
modules = ["edge_backup", "edge_check", "home_tools"]

[[tool.importlinter.contracts]]
name = "edge_backup and home_tools never reach up into edge or hal"
type = "forbidden"
source_modules = ["edge_backup", "home_tools"]
forbidden_modules = ["edge", "hal"]

[[tool.importlinter.contracts]]
name = "edge never imports the workstation tool or the backup runner"
type = "forbidden"
source_modules = ["edge"]
forbidden_modules = ["home_tools", "edge_backup"]

[[tool.importlinter.contracts]]
name = "hal_output imports nothing else of this repository"
type = "forbidden"
source_modules = ["hal_output"]
forbidden_modules = ["edge", "edge_check", "edge_backup", "home_tools", "hal"]
