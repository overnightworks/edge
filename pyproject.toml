[project]
name = "home-tools"
version = "0.1.0"
description = "Keeps the home directory in the shape ~/README.md describes"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["tidy_home"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
    # The process entry hands main()'s return value to the OS and does nothing
    # else. Tests call main() directly with an injected home; spawning a
    # process here would test the interpreter, not this tool.
    'if __name__ == "__main__":',
]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
