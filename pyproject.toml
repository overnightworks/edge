[project]
name = "edge-check"
version = "0.1.0"
description = "The edge tools: the edge command, the loopback alarm edge-check and the backup runner edge-backup."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.scripts]
edge = "edge.cli:main"
edge-check = "edge_check.cli:main"
edge-backup = "edge_backup.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.15"]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["edge", "edge_check", "edge_backup"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["keycloak/go-live", "step-ca/init"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
