[project]
name = "edge-check"
version = "0.1.0"
description = "The edge tools: the edge command, the loopback alarm edge-check, the backup runner edge-backup and home, the workstation tool."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.scripts]
edge = "edge.cli:main"
edge-check = "edge_check.cli:main"
edge-backup = "edge_backup.cli:main"
home = "home_tools.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.15"]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["edge", "edge_check", "edge_backup", "home_tools"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["keycloak/go-live", "step-ca/init"]

[tool.ruff.format]
# home's tree is imported as it is: home-tools#56 / home-tools#45 move its texts.
# Deletion target: home-tools#45, or one mechanical reformat item, whichever lands first.
exclude = ["src/home_tools/**", "scripts/check_root_layout.py", "tests/home/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Same reason and deletion target as [tool.ruff.format]. E501: home's lines run to 140;
# RUF001: the German strings carry U+203A; I001/RUF009/RUF043/RUF100: single imported lines
# (the last three only in the tests).
"src/home_tools/**" = ["E501", "I001", "RUF001"]
"scripts/check_root_layout.py" = ["E501"]
"tests/home/**" = ["E501", "I001", "RUF001", "RUF009", "RUF043", "RUF100"]

[tool.coverage.run]
branch = true

# No fail_under: edge is not at 100 %. home's floor is per path, in CI's check job.
[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
pythonpath = ["src", "scripts"]
