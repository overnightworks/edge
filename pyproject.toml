[project]
name = "home-tools"
version = "0.1.0"
description = "Keeps the home directory in the shape ~/README.md describes"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
tidy-home = "home_tools.tidy_home:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import the home_tools package from `src` and the root-layout gate
# from `scripts` straight out of the tree, so they never depend on how the
# package was installed; CI's smoke step proves the installed package.
pythonpath = ["src", "scripts"]

[tool.coverage.run]
source = ["src", "scripts"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
    # The process entry hands main()'s return value to the OS and does nothing
    # else. Tests call main() directly with an injected home; spawning a
    # process here would test the interpreter, not this tool.
    'if __name__ == "__main__":',
]

[tool.ruff]
line-length = 140
# Same roots as pytest's pythonpath, so ruff sorts home_tools and
# check_root_layout as first-party imports.
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
