[project]
name = "edge-check"
version = "0.1.0"
description = "Read-only alarm for anything on this PC exposed beyond loopback."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
edge-check = "edge_check.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15"]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
