sonar.organization=overnightworks
sonar.projectKey=overnightworks_edge
sonar.sources=src,keycloak/secret-check,probe/keycloak,probe/step-ca,probe/switches,probe/edge_copy.py
sonar.tests=tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
# The step-ca and switches probes drive a live docker compose stack (proofs 1-5 of #38, probe
# cells 1-7 of #61), and edge_copy.py is their shared helper; they are indexed for issues but
# cannot run under the unit-test coverage job. The Keycloak probe drives a live stack too (proofs
# 1-10 of #12, #105 and #108), and its relying party runs in a container; the probe run itself
# is its proof.
sonar.coverage.exclusions=probe/step-ca/**,probe/switches/**,probe/keycloak/**,probe/edge_copy.py
