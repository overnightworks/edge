sonar.organization=overnightworks
sonar.projectKey=overnightworks_edge
sonar.sources=src,scripts,keycloak/secret-check,probe/keycloak,probe/step-ca,probe/switches,probe/edge_copy.py
sonar.tests=tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
# The step-ca and switches probes drive a live docker compose stack (proofs 1-5 of #38, probe
# cells 1-7 of #61), and edge_copy.py is their shared helper; they are indexed for issues but
# cannot run under the unit-test coverage job. The Keycloak probe's harness (teardown, signals,
# hold, cookies) is unit-tested by tests/test_keycloak_probe.py, which CI still runs. Its proof
# methods assert against a live Keycloak; testing them against a fake one would only restate the
# assertion, so that route was judged counterproductive and the probe run is their proof.
# test_rp.py runs inside the probe's relying-party container. Sonar cannot exclude single
# methods, so the whole folder is excluded and gating new harness lines on coverage is given up.
sonar.coverage.exclusions=probe/step-ca/**,probe/switches/**,probe/keycloak/**,probe/edge_copy.py
# S8701 flags the git clone in agent_service_lock.py as command injection by a faulty CLI argument.
# The stronger owner is release_tag: its canonical pattern is checked before any process call, no
# shell is used, and -- precedes the URL and the directory. Two code routes were tried and still
# flagged: validating the tag inside the function, and making the tag the only parameter with the
# URL and command as module constants.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=pythonsecurity:S8701
sonar.issue.ignore.multicriteria.e1.resourceKey=scripts/agent_service_lock.py
