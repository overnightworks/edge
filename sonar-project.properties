sonar.organization=overnightworks
sonar.projectKey=overnightworks_edge
sonar.sources=src,keycloak/secret-check,probe/keycloak,probe/step-ca
sonar.tests=tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
# The step-ca probe drives a live docker compose stack (proofs 1-5 of #38); it is indexed for
# issues but cannot run under the unit-test coverage job.
sonar.coverage.exclusions=probe/step-ca/**
# The step-ca probe uses plain http on purpose: proof 6 sends http to the TLS port and expects a
# refusal, and the backend behind the gateway speaks http inside the compose network.
sonar.issue.ignore.multicriteria=probeplainhttp
sonar.issue.ignore.multicriteria.probeplainhttp.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.probeplainhttp.resourceKey=probe/step-ca/probe.py
