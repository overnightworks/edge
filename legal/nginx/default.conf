# The legal unit: static pages, one stylesheet and the login theme's fonts, nothing else.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log off;

    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; font-src 'self'; img-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Cloudflare leaves the body alone, so the texts reach people as they are written.
    add_header Cache-Control "no-transform" always;

    root /srv/pages;

    location / {
        try_files $uri.html =404;
    }

    # try_files answers a directory or a missing file with 404, never an index or a 403.
    location /_rechtliches/ {
        alias /srv/assets/;
        try_files $uri =404;
    }

    location /_rechtliches/fonts/ {
        alias /srv/fonts/;
        try_files $uri =404;
    }
}
