# Template only. The operator applies it to /etc/cloudflared/config.yml himself (README, steps A8);
# an agent never applies it. Replace every <...> placeholder.
tunnel: <TUNNEL-ID>
credentials-file: /etc/cloudflared/<TUNNEL-ID>.json

ingress:
  - hostname: hallucinai.de
    service: http://localhost:8080
  - hostname: www.hallucinai.de
    service: http://localhost:8080
  - hostname: presentator.hallucinai.de
    service: http://localhost:8100
  # Every other subdomain goes to the edge gatekeeper; cloudflared itself rejects requests
  # without a valid Access token for the wildcard Access app. Keep teamName and audTag together.
  - hostname: "*.hallucinai.de"
    service: http://127.0.0.1:8081
    originRequest:
      access:
        required: true
        teamName: <ACCESS-TEAM-NAME>
        audTag:
          - <WILDCARD-ACCESS-APP-AUD-TAG>
  - service: http_status:404
