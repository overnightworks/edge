cloudflare:
  zone: edge-fixture.invalid
  redirect:
    hosts: ["@", www]
    target: "https://auth.edge-fixture.invalid/"
    keep:
      - {path: /impressum, target: "https://app.edge-fixture.invalid"}
      - {path: /datenschutz, target: "https://app.edge-fixture.invalid"}
    serve: {pages: [/terms, /conditions], files: /_legal/}

github:
  org: edge-fixture.invalid

services:
  app:
    hosts:
      - {name: app, exposure: public, reason: "own login"}
  legal:
    hosts:
      - {name: "@", exposure: public, reason: "static legal pages"}
